name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        id: proj
        run: |
          if [ -f miniacar_mod_src.zip ]; then
            unzip -q -o miniacar_mod_src.zip -d _unpacked
          fi
          FILE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "build.gradle not found. Repository contents:"
            find . -not -path './.git/*' | head -n 50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          ls -la "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.3

      - name: Build jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle setupCIWorkspace build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: miniacar-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
