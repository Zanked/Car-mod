name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        id: proj
        run: |
          if [ -f miniacar_mod_src.zip ]; then
            unzip -q -o miniacar_mod_src.zip -d _unpacked
          fi
          FILE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "build.gradle not found. Repository contents:"
            find . -not -path './.git/*' | head -n 50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Use ForgeGradle 2.3 fork + pick a Forge version that has userdev
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          sed -i "s#net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT#com.anatawa12.forge:ForgeGradle:2.3-1.0.+#" build.gradle
          FOUND=""
          for V in 2862 2861 2860 2859 2854 2851 2847 2846 2845 2844 2843 2842 2841; do
            FV="1.12.2-14.23.5.$V"
            for BASE in https://maven.minecraftforge.net https://maven.daporkchop.net; do
              URL="$BASE/net/minecraftforge/forge/$FV/forge-$FV-userdev.jar"
              CODE=$(curl -s -L -o /dev/null -w "%{http_code}" "$URL")
              echo "$CODE  $URL"
              if [ "$CODE" = "200" ] && [ -z "$FOUND" ]; then FOUND="$FV"; FBASE="$BASE"; fi
            done
          done
          if [ -z "$FOUND" ]; then
            echo "No userdev jar found on any server."
            exit 1
          fi
          echo "Using Forge $FOUND from $FBASE"
          sed -i "s#1.12.2-14.23.5.2860#$FOUND#" build.gradle
          if [ "$FBASE" = "https://maven.daporkchop.net" ]; then
            printf '\nrepositories {\n    maven { url = "https://maven.daporkchop.net" }\n}\n' >> build.gradle
          fi
          grep -n -E "ForgeGradle|version =|daporkchop" build.gradle

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.10.3

      - name: Build jar
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          GRADLE_OPTS: -Dhttps.protocols=TLSv1.2,TLSv1.3
        run: gradle setupCIWorkspace build --no-daemon --refresh-dependencies

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: miniacar-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
